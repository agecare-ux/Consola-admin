services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agecare
      POSTGRES_PASSWORD: agecare
      POSTGRES_DB: agecare_admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agecare -d agecare_admin"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_DATABASE_URL: postgresql+asyncpg://agecare:agecare@db:5432/agecare_admin
      ADMIN_JWT_SECRET: solo-para-desarrollo
    ports:
      - "8000:8000"
    # Aplica el modelo canónico (idempotente) y siembra los datos de demo en cada
    # arranque: la base local siempre parte del mismo estado conocido.
    command: >
      sh -c "python -m scripts.aplicar_modelo &&
             python -m scripts.seed_canonico &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
